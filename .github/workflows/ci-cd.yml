name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Block direct pushes to main that aren't from dev
  branch-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check if push is from dev branch
        run: |
          echo "Checking push to main branch..."

          # Get the previous commit to see if it came from dev
          # This is a basic check - branch protection rules are more robust
          if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "⚠️  Direct pushes to main are not allowed!"
            echo "Please create a pull request from dev branch instead."
            exit 1
          fi

  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Frontend Dependencies
        working-directory: ./aura-tracker-pro
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Security Audit (Frontend)
        working-directory: ./aura-tracker-pro
        run: npm audit --audit-level=high || true

      - name: Security Audit (Backend)
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Lint Frontend
        working-directory: ./aura-tracker-pro
        run: npm run lint

  build-and-test:
    needs: security-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Frontend Dependencies
        working-directory: ./aura-tracker-pro
        run: npm ci

      - name: Build Frontend
        working-directory: ./aura-tracker-pro
        run: npm run build

  deploy:
    needs: [branch-check, build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Production
        run: echo "Deploying to production server..."

  notify:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Success
        if: ${{ success() }}
        run: echo "Pipeline passed successfully!"

      - name: Notify Failure
        if: ${{ failure() }}
        run: echo "Pipeline failed! Check logs."
